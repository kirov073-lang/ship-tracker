<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Мой флот</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
<style>
/*
VOICE   bridge instrument: calm, exact, no decoration
IDEA    an ECDIS screen at night with a sea-service record beside it
PICTURE the live chart, full screen; ship symbols coloured by type, mine in magenta
COLOUR  deep navy chrome, chart basemap, Admiralty magenta for my ships
TYPE    Barlow Semi Condensed for names and figures, Barlow for text
LAYOUT  phone: chart + bottom tabs + sheet; desktop: side panel + chart
*/
:root{color-scheme:dark;--chrome:#0d1b2a;--chrome2:#132638;--line:#22384f;--ink:#e6edf4;--soft:#94a7ba;
--mag:#ec4f9e;--blue:#5aa9ec;--ok:#4fc68a;--warn:#e8b04a;--tab:64px}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overflow:hidden;background:var(--chrome);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
#map{position:fixed;top:calc(56px + env(safe-area-inset-top));left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom));background:#aadaff}
.hdr{position:fixed;z-index:1250;left:0;right:0;top:0;height:calc(56px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:#243040;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;border-bottom:1px solid #1b2633}
.hdr h1{margin:0;text-align:center;font:600 22px/1 Barlow,sans-serif;color:#fff}
.hdr button{width:56px;height:56px;border:0;background:none;display:grid;place-items:center;cursor:pointer}
.hdr svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.maplibregl-ctrl-group{background:rgba(13,27,42,.92)!important;border:1px solid var(--line);box-shadow:none!important;border-radius:10px!important}
.maplibregl-ctrl-group button{width:40px!important;height:40px!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-attrib{font-size:10px;background:rgba(13,27,42,.55)!important;color:rgba(255,255,255,.7)}
.maplibregl-ctrl-attrib a{color:rgba(255,255,255,.8)!important}
.maplibregl-ctrl-attrib-button{filter:invert(1);opacity:.6}
.now div:nth-child(3) b{white-space:normal;font-size:19px;line-height:1.15}

.fabs{position:fixed;z-index:1000;right:12px;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 34px);display:flex;flex-direction:column;gap:10px}
.fab{width:64px;height:64px;border-radius:50%;border:2px solid #3a6ea8;background:rgba(36,48,64,.92);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.fab svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.count{position:fixed;z-index:1000;left:12px;font-size:12px!important;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 34px);background:rgba(13,27,42,.9);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--soft);max-width:calc(100% - 100px)}
.count b{color:var(--ink);font-weight:600}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:6px 12px 8px;font-size:13px;color:var(--soft)}
.legend span{white-space:nowrap}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.menu{position:fixed;z-index:1100;right:74px;width:260px;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 34px);background:var(--chrome2);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;min-width:200px}
.menu.on{display:block}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left}
.menu button[aria-checked=true]{background:#1d3550}
.menu button[aria-checked=true]::after{content:"✓";color:var(--mag);font-weight:700}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

.tabs{position:fixed;z-index:1200;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#132233;border-top:1px solid #1b2633;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:#7f93a6;cursor:pointer;position:relative}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true]{color:#fff}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--mag);color:#fff;border-radius:9px;font-size:11px;font-weight:700;padding:0 6px;line-height:18px}

.sheet{position:fixed;z-index:1150;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom));height:62dvh;background:var(--chrome);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;transform:translateY(110%);transition:transform .28s ease,height .28s ease}
.sheet.on{transform:none}
.sheet.full{height:calc(100dvh - var(--tab) - env(safe-area-inset-bottom) - env(safe-area-inset-top) - 64px)}
.grab{flex:none;height:30px;display:grid;place-items:center;cursor:grab;touch-action:none;border:0;background:none;width:100%}
.grab::before{content:"";width:44px;height:5px;border-radius:3px;background:#3a536d}
.shead{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px 10px}
.shead h2{flex:1;margin:0;font:700 26px/1.1 "Barlow Semi Condensed","Arial Narrow",sans-serif;overflow-wrap:anywhere}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--chrome2);font-size:22px;cursor:pointer;line-height:1;flex:none}
.sbody{flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}

.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--chrome2);padding:0 14px 0 42px;font-size:17px}
.search input:focus{border-color:var(--blue);outline:none}
.search svg{position:absolute;left:13px;top:14px;width:20px;height:20px;stroke:var(--soft);fill:none;stroke-width:2}
.hint{color:var(--soft);font-size:14px;margin:4px 0 10px}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:0 10px;align-items:baseline;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:active{background:var(--chrome2)}
.flag{font-size:21px;line-height:1;grid-row:span 3;align-self:center}
.nm{font:600 19px/1.25 "Barlow Semi Condensed","Arial Narrow",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--blue)}
.mine .nm{color:var(--mag)}
.right{font-size:13px;color:var(--soft);white-space:nowrap;text-align:right}
.meta{grid-column:2/4;color:var(--soft);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{grid-column:2/4;font-size:14px;font-style:italic}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--soft)}
.dot.go{background:var(--ok)}.dot.stop{background:var(--blue)}.dot.old{background:var(--warn)}
.empty{padding:18px 2px;color:var(--soft)}
.empty strong{display:block;color:var(--ink);font:600 20px/1.2 "Barlow Semi Condensed","Arial Narrow",sans-serif;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--chrome2);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.main{background:var(--mag);border-color:var(--mag);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.sub{color:var(--soft);margin:0}
.now{background:var(--chrome2);border-radius:12px;padding:12px 14px;margin:12px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.now b{display:block;font:600 23px/1.1 "Barlow Semi Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now span{font-size:13px;color:var(--soft)}
.now p{grid-column:1/-1;margin:0;font-size:14px}
dl{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:7px 12px;margin:12px 0;font-size:15px}
dt{color:var(--soft)}dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.photo{position:relative;aspect-ratio:16/9;border-radius:12px;background:var(--chrome2);overflow:hidden;margin:6px 0 4px;display:grid;place-items:center;color:var(--soft);font-size:14px;text-align:center;padding:0}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo a.btn{position:relative}
.cap{font-size:12px;color:var(--soft);margin:0 0 6px;overflow-wrap:anywhere}.cap a{color:var(--soft)}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
label.f{display:block;font-size:14px;color:var(--soft);margin:12px 0 4px}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:12px;background:var(--chrome2);padding:10px 12px;font-size:16px;resize:vertical}
details{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;min-height:32px}
.status{font-size:13px;color:var(--soft);margin:18px 0 0}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--chrome);padding:10px 16px;border-radius:10px;font-weight:600;transition:.25s;z-index:3000;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.me{width:18px;height:18px;border-radius:50%;background:#2f8cff;border:3px solid #fff;box-shadow:0 0 0 8px rgba(47,140,255,.25)}

@media(min-width:900px){
 :root{--tab:0px}
 .tabs{right:auto;top:0;bottom:auto;width:420px;height:calc(56px + env(safe-area-inset-top));padding:0;border-top:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
 .sheet,.sheet.full{right:auto;top:56px;bottom:0;width:420px;height:auto;border-radius:0;transform:none;border-top:0;border-right:1px solid var(--line);box-shadow:none}
 .grab,.x{display:none}.shead{padding-top:14px}
 #map{left:420px;bottom:0}
 .hdr{left:420px}
 .count{left:436px;bottom:24px}.fabs{bottom:24px}.menu{bottom:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Карта судов"></div>

<header class="hdr"><button id="hmenu" aria-label="Вид карты"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h1 id="htitle">Карта</h1><button id="sbox" aria-label="Поиск судна"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg></button></header>

<div class="count" id="count">Загружаю базу судов…</div>

<div class="fabs">
  <button class="fab" id="f-loc" title="Где я" aria-label="Показать моё место и суда рядом"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></button>
  <button class="fab" id="f-fleet" title="Мои суда на карте" aria-label="Показать мои суда на карте"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v14M8 10h8M5 14a7 7 0 0 0 14 0"/></svg></button>
  <button class="fab" id="f-list" title="Суда рядом списком" aria-label="Суда рядом списком"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></button>
  <button class="fab" id="f-layers" title="Вид карты" aria-label="Вид карты" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
</div>
<div class="menu" id="menu" role="menu">
  <button role="menuitemradio" data-base="hybrid">Спутник</button>
  <button role="menuitemradio" data-base="chart">Схема, как Google</button>
  <button role="menuitemradio" data-base="light">Светлая простая</button>
  <hr>
  <button role="menuitemcheckbox" id="m-sea">Морские знаки</button>
  <button role="menuitemcheckbox" id="m-names">Названия судов</button>
  <hr>
  <div class="legend" id="legend"></div>
</div>

<section class="sheet" id="sheet" aria-live="polite">
  <button class="grab" id="grab" aria-label="Развернуть или свернуть"></button>
  <div class="shead"><h2 id="stitle"></h2><button class="x" id="sclose" aria-label="Закрыть">×</button></div>
  <div class="sbody" id="sbody"></div>
</section>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="fleet" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 17l2 3h14l2-3H3zM5 17v-5h14v5M8 12V8h8v4M11 8V5h2v3"/></svg>Мой флот<span class="badge" id="badge" hidden></span></button>
  <button class="tab" role="tab" data-tab="search" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg>Поиск</button>
  <button class="tab" role="tab" data-tab="map" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>Карта</button>
  <button class="tab" role="tab" data-tab="near" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>Рядом</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
<script>
{
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const desktop = () => matchMedia('(min-width:900px)').matches;
const ls = {get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
            set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }};
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2600); }

/* ---------- reference tables ---------- */
const MID = (() => { const m = {}; "201AL 202AD 203AT 204PT 205BE 206BY 207BG 208VA 209CY 210CY 211DE 212CY 213GE 214MD 215MT 216AM 218DE 219DK 220DK 224ES 225ES 226FR 227FR 228FR 229MT 230FI 231FO 232GB 233GB 234GB 235GB 236GI 237GR 238HR 239GR 240GR 241GR 242MA 243HU 244NL 245NL 246NL 247IT 248MT 249MT 250IE 251IS 252LI 253LU 254MC 255PT 256MT 257NO 258NO 259NO 261PL 262ME 263PT 264RO 265SE 266SE 267SK 268SM 269CH 270CZ 271TR 272UA 273RU 274MK 275LV 276EE 277LT 278SI 279RS 301AI 303US 304AG 305AG 306CW 307AW 308BS 309BS 310BM 311BS 312BZ 314BB 316CA 319KY 321CR 323CU 325DM 327DO 329GP 330GD 331GL 332GT 334HN 336HT 338US 339JM 341KN 343LC 345MX 347MQ 348MS 350NI 351PA 352PA 353PA 354PA 355PA 356PA 357PA 358PR 359SV 361PM 362TT 364TC 366US 367US 368US 369US 370PA 371PA 372PA 373PA 374PA 375VC 376VC 377VC 378VG 379VI 401AF 403SA 405BD 408BH 410BT 412CN 413CN 414CN 416TW 417LK 419IN 422IR 423AZ 425IQ 428IL 431JP 432JP 434TM 436KZ 437UZ 438JO 440KR 441KR 443PS 445KP 447KW 450LB 451KG 453MO 455MV 457MN 459NP 461OM 463PK 466QA 468SY 470AE 471AE 472TJ 473YE 475YE 477HK 478BA 501TF 503AU 506MM 508BN 510FM 511PW 512NZ 514KH 515KH 516CX 518CK 520FJ 523CC 525ID 529KI 531LA 533MY 536MP 538MH 540NC 542NU 544NR 546PF 548PH 550TL 553PG 555PN 557SB 559AS 561WS 563SG 564SG 565SG 566SG 567TH 570TO 572TV 574VN 576VU 577VU 578WF 601ZA 603AO 605DZ 607TF 608SH 609BI 610BJ 611BW 612CF 613CM 615CG 616KM 617CV 619CI 620KM 621DJ 622EG 624ET 625ER 626GA 627GH 629GM 630GW 631GQ 632GN 633BF 634KE 636LR 637LR 638SS 642LY 644LS 645MU 647MG 649ML 650MZ 654MR 655MW 656NE 657NG 659NA 660RE 661RW 662SD 663SN 664SC 665SH 666SO 667SL 668ST 669SZ 670TD 671TG 672TN 674TZ 675UG 676CD 677TZ 678ZM 679ZW 701AR 710BR 720BO 725CL 730CO 735EC 740FK 745GF 750GY 755PY 760PE 765SR 770UY 775VE".split(' ').forEach(p => m[p.slice(0,3)] = p.slice(3)); return m; })();
let regionName = c => c;
try { const dn = new Intl.DisplayNames(['ru'], {type:'region'}); regionName = c => dn.of(c) || c; } catch(e){}
const iso = mmsi => MID[String(mmsi).slice(0,3)] || '';
const flagOf = mmsi => { const c = iso(mmsi); return c ? String.fromCodePoint(...[...c].map(ch => 127397 + ch.charCodeAt(0))) : '🏳'; };
// colour groups follow the convention seafarers know from AIS plotters
const GROUPS = [
  ['Грузовые', '#39e639', t => t >= 70 && t <= 79],
  ['Танкеры', '#ff3b3b', t => t >= 80 && t <= 89],
  ['Пассажирские', '#3b82ff', t => t >= 60 && t <= 69],
  ['Служебные', '#5ad1ff', t => [31,32,33,34,50,51,52,53,54,55,58,59].includes(t)],
  ['Рыболовные', '#ff9a1f', t => t === 30],
  ['Скоростные', '#ffe21f', t => t >= 40 && t <= 49],
  ['Яхты', '#ff4dff', t => t === 36 || t === 37],
  ['Прочие', '#8aa0b6', () => true],
];
const colorOf = t => GROUPS.find(g => g[2](t || 0))[1];
const typeName = t => {
  if (!t) return 'тип неизвестен';
  if (t >= 70 && t <= 79) return 'грузовое';
  if (t >= 80 && t <= 89) return 'танкер';
  if (t >= 60 && t <= 69) return 'пассажирское';
  return ({30:'рыболовное',31:'буксир',32:'буксир',33:'земснаряд',34:'водолазное',35:'военное',36:'парусное',37:'прогулочное',50:'лоцманское',51:'спасательное',52:'буксир',53:'портовое',54:'экологическое',55:'полиция',58:'медицинское'})[t] || (t >= 40 && t <= 49 ? 'скоростное' : 'прочее');
};
const NAV = {0:'на ходу',1:'на якоре',2:'не управляется',3:'ограничено в манёвре',4:'стеснено осадкой',5:'у причала',6:'на мели',7:'ловит рыбу',8:'под парусом'};
const rtf = new Intl.RelativeTimeFormat('ru', {numeric:'auto'});
const ago = ts => {
  if (!ts) return 'нет данных';
  const s = Date.now()/1000 - ts;
  if (s < 90) return 'только что';
  if (s < 3600) return rtf.format(-Math.round(s/60), 'minute');
  if (s < 86400) return rtf.format(-Math.round(s/3600), 'hour');
  return rtf.format(-Math.round(s/86400), 'day');
};
const fmtDate = ts => new Date(ts*1000).toLocaleString('ru', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const fmtNm = d => d < 10 ? d.toFixed(1).replace('.', ',') + ' мили' : Math.round(d) + ' миль';

/* ---------- state ---------- */
let F = {}, SHIPS = [], byMmsi = new Map(), byImo = new Map(), updated = 0;
let fleet = ls.get('fleet.v1', []);
let prefs = Object.assign({base:'hybrid', sea:false, names:true}, ls.get('prefs.v5', {}));
let myPos = null, tab = 'map', shipOpen = null, query = '';
const get = (r, k) => r ? r[F[k]] : undefined;
const findShip = e => (e.imo && byImo.get(+e.imo)) || (e.mmsi && byMmsi.get(+e.mmsi)) || null;
const fleetIdx = r => fleet.findIndex(e => (e.imo && +e.imo === get(r,'imo')) || (e.mmsi && +e.mmsi === get(r,'mmsi')));
let fleetSet = new Set();
function refreshFleetSet(){ fleetSet = new Set(fleet.map(findShip).filter(Boolean)); const b = $('#badge'); b.hidden = !fleet.length; b.textContent = fleet.length; }

/* ---------- map ----------
   One engine (MapLibre GL) draws both the basemap and the ships on the GPU, so ships never
   drift from the map while zooming. Basemap: OpenFreeMap professional styles (free, no key). */
const OFM = n => 'https://tiles.openfreemap.org/styles/' + n;
const NAME = ['coalesce', ['get', 'name:ru'], ['get', 'name:latin'], ['get', 'name']];

const STYLES = {chart: OFM('liberty'), light: OFM('positron'), hybrid: SAT};
const map = new maplibregl.Map({container: 'map', style: STYLES[prefs.base] || STYLES.hybrid, center: [30, 46], zoom: 3,
  minZoom: 1.5, maxZoom: 18, attributionControl: {compact: true}, dragRotate: false, pitchWithRotate: false});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');
const R_EARTH_NM = 3440.065;
const nm = (a, b) => { const r = Math.PI / 180, la1 = a.lat * r, la2 = b[0] * r, dla = la2 - la1, dlo = (b[1] - a.lng) * r;
  return 2 * R_EARTH_NM * Math.asin(Math.sqrt(Math.sin(dla / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dlo / 2) ** 2)); };
// on a phone the sheet covers the lower part of the map: aim at the visible part above it
function flyVisible(ll, z){
  const cover = !desktop() && sheet.classList.contains('on') ? sheet.getBoundingClientRect().height : 0;
  map.flyTo({center: [ll.lng ?? ll[1], ll.lat ?? ll[0]], zoom: z ?? map.getZoom(), padding: {top: 0, bottom: cover, left: 0, right: 0}, duration: 800});
}

/* ship symbols, drawn once at high resolution and handed to the map as images */
const GROUP_KEYS = ['cargo', 'tanker', 'pass', 'tug', 'fish', 'fast', 'yacht', 'other'];
GROUPS.forEach((g, i) => g.key = GROUP_KEYS[i]);
const groupKey = t => GROUPS.find(g => g[2](t || 0)).key;
function makeIcon(color, moving, mine){
  const q = 3, W = moving ? 16 : 14, H = moving ? 30 : 14, c = document.createElement('canvas');
  c.width = (W + 8) * q; c.height = (H + 8) * q;
  const g = c.getContext('2d'); g.scale(q, q); g.translate((W + 8) / 2, (H + 8) / 2);
  g.shadowColor = 'rgba(15,23,42,.45)'; g.shadowBlur = 3; g.shadowOffsetY = 1.2;
  g.beginPath();
  if (moving){
    const L2 = H / 2, w = W / 2 - 1.5;
    g.moveTo(0, -L2);
    g.bezierCurveTo(w * .6, -L2 * .72, w, -L2 * .3, w, 0);
    g.lineTo(w, L2 * .8); g.quadraticCurveTo(w, L2, w * .65, L2);
    g.lineTo(-w * .65, L2); g.quadraticCurveTo(-w, L2, -w, L2 * .8);
    g.lineTo(-w, 0);
    g.bezierCurveTo(-w, -L2 * .3, -w * .6, -L2 * .72, 0, -L2);
  } else g.arc(0, 0, W / 2 - 1.5, 0, Math.PI * 2);
  g.fillStyle = color; g.fill();
  g.shadowColor = 'transparent';
  g.lineWidth = mine ? 2.2 : 1.6; g.strokeStyle = '#ffffff'; g.stroke();
  if (moving){ g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.arc(0, H * .22, 1.8, 0, Math.PI * 2); g.fill(); }
  const d = g.getImageData(0, 0, c.width, c.height);
  return {width: c.width, height: c.height, data: new Uint8Array(d.data.buffer)};
}
function addIcons(){
  for (const g of GROUPS){
    if (!map.hasImage('h-' + g.key)) map.addImage('h-' + g.key, makeIcon(g[1], true), {pixelRatio: 3});
    if (!map.hasImage('d-' + g.key)) map.addImage('d-' + g.key, makeIcon(g[1], false), {pixelRatio: 3});
  }
  if (!map.hasImage('city-dot')){ const c = document.createElement('canvas'); c.width = c.height = 24; const g = c.getContext('2d');
    g.beginPath(); g.arc(12, 12, 7, 0, 7); g.fillStyle = '#fff'; g.fill(); g.beginPath(); g.arc(12, 12, 4, 0, 7); g.fillStyle = '#334155'; g.fill();
    map.addImage('city-dot', {width: 24, height: 24, data: new Uint8Array(g.getImageData(0, 0, 24, 24).data.buffer)}, {pixelRatio: 3}); }
  if (!map.hasImage('h-mine')) map.addImage('h-mine', makeIcon('#e11d74', true, true), {pixelRatio: 3});
  if (!map.hasImage('d-mine')) map.addImage('d-mine', makeIcon('#e11d74', false, true), {pixelRatio: 3});
}
function shipsGeo(){
  const f = [];
  SHIPS.forEach((r, i) => {
    const lat = get(r,'lat'); if (lat == null) return;
    const dir = get(r,'hdg') ?? get(r,'cog'), mv = (get(r,'sog') || 0) >= .5 && dir != null, mine = fleetSet.has(r);
    f.push({type: 'Feature', geometry: {type: 'Point', coordinates: [get(r,'lon'), lat]},
      properties: {i, icon: (mv ? 'h-' : 'd-') + (mine ? 'mine' : groupKey(get(r,'type'))), rot: mv ? dir : 0, n: get(r,'name') || '', mine: mine ? 1 : 0, big: get(r,'len') || 0}});
  });
  return {type: 'FeatureCollection', features: f};
}
// bigger ship, bigger symbol: AIS gives length, which follows deadweight closely
const BY_LEN = ['interpolate', ['linear'], ['get', 'big'], 0, .75, 40, .7, 100, .85, 180, 1.05, 250, 1.25, 330, 1.45, 400, 1.6];
const SIZE = ['interpolate', ['linear'], ['zoom'], 2, ['*', .42, BY_LEN], 5, ['*', .55, BY_LEN], 8, ['*', .75, BY_LEN], 12, ['*', 1, BY_LEN], 16, ['*', 1.25, BY_LEN]];
function addShipLayers(){
  addIcons();
  if (!map.getSource('ships')) map.addSource('ships', {type: 'geojson', data: shipsGeo()});
  if (!map.getSource('sel')) map.addSource('sel', {type: 'geojson', data: {type: 'FeatureCollection', features: []}});
  if (!map.getSource('seamarks')) map.addSource('seamarks', {type: 'raster', tileSize: 256, tiles: ['https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png'], attribution: '© OpenSeaMap'});
  const font = prefs.base === 'hybrid' ? ['Noto Sans Regular'] : ['Noto Sans Regular'];
  const add = l => { if (!map.getLayer(l.id)) map.addLayer(l); };
  add({id: 'seamarks', type: 'raster', source: 'seamarks', minzoom: 9, layout: {visibility: prefs.sea ? 'visible' : 'none'}});
  add({id: 'sel', type: 'circle', source: 'sel', paint: {'circle-radius': 18, 'circle-color': 'rgba(225,29,116,.12)', 'circle-stroke-color': '#e11d74', 'circle-stroke-width': 2.5}});
  add({id: 'ships', type: 'symbol', source: 'ships', filter: ['==', ['get', 'mine'], 0],
    layout: {'icon-image': ['get', 'icon'], 'icon-size': SIZE, 'icon-rotate': ['get', 'rot'], 'icon-rotation-alignment': 'map',
      'icon-allow-overlap': true, 'icon-ignore-placement': true, 'symbol-sort-key': ['get', 'big']}});
  add({id: 'ship-names', type: 'symbol', source: 'ships', minzoom: 9, filter: ['all', ['==', ['get', 'mine'], 0], ['!=', ['get', 'n'], '']],
    layout: {visibility: prefs.names ? 'visible' : 'none', 'text-field': ['get', 'n'], 'text-font': font, 'text-size': 11,
      'text-anchor': 'top', 'text-offset': [0, 1.1], 'text-optional': true, 'text-max-width': 12, 'symbol-sort-key': ['-', 0, ['get', 'big']]},
    paint: {'text-color': prefs.base === 'hybrid' ? '#ffffff' : '#1f2937', 'text-halo-color': prefs.base === 'hybrid' ? 'rgba(0,0,0,.8)' : '#ffffff', 'text-halo-width': 1.6}});
  add({id: 'fleet', type: 'symbol', source: 'ships', filter: ['==', ['get', 'mine'], 1],
    layout: {'icon-image': ['get', 'icon'], 'icon-size': ['interpolate', ['linear'], ['zoom'], 2, .8, 10, 1.25, 16, 1.5],
      'icon-rotate': ['get', 'rot'], 'icon-rotation-alignment': 'map', 'icon-allow-overlap': true, 'icon-ignore-placement': true,
      'text-field': ['get', 'n'], 'text-font': ['Noto Sans Bold'], 'text-size': 12, 'text-anchor': 'left', 'text-offset': [1.4, 0],
      'text-allow-overlap': true},
    paint: {'text-color': '#ffffff', 'text-halo-color': '#e11d74', 'text-halo-width': 3}});
}
// Russian place names where the map data has them
function russianLabels(){
  if (prefs.base === 'hybrid') return;
  for (const l of map.getStyle().layers){
    if (l.type !== 'symbol' || !l.layout || !l.layout['text-field'] || ['ship-names', 'fleet'].includes(l.id)) continue;
    const tf = JSON.stringify(l.layout['text-field']);
    if (/name/.test(tf) && !/ref|housenumber/.test(tf))
      map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', 'name:ru'], ['get', 'name:latin'], ['get', 'name']]);
  }
}
map.once('load', () => { const a = document.querySelector('.maplibregl-ctrl-attrib'); if (a) a.classList.remove('maplibregl-compact-show'); });
map.on('style.load', () => { try { russianLabels(); } catch(e){} addShipLayers(); });
map.on('styleimagemissing', () => addIcons());
function draw(){
  const s = map.getSource && map.getSource('ships'); if (s) s.setData(shipsGeo());
  const sel = map.getSource('sel');
  if (sel) sel.setData({type: 'FeatureCollection', features: shipOpen && get(shipOpen,'lat') != null ? [{type: 'Feature', properties: {}, geometry: {type: 'Point', coordinates: [get(shipOpen,'lon'), get(shipOpen,'lat')]}}] : []});
  countOnScreen();
}
function countOnScreen(){
  const el = $('#count');
  if (!SHIPS.length){ el.textContent = el.dataset.msg || 'Загружаю базу судов…'; return; }
  const b = map.getBounds(); let n = 0;
  for (const r of SHIPS){ const lat = get(r,'lat'); if (lat != null && b.contains([get(r,'lon'), lat])) n++; }
  el.innerHTML = `<b>${n.toLocaleString('ru')}</b> судов на экране`;
}
map.on('moveend', countOnScreen);
let base = prefs.base;
function applyPrefs(){
  if (prefs.base !== base){ base = prefs.base; map.setStyle(STYLES[prefs.base] || STYLES.hybrid); }
  else if (map.getLayer('ship-names')){
    map.setLayoutProperty('ship-names', 'visibility', prefs.names ? 'visible' : 'none');
    map.setLayoutProperty('seamarks', 'visibility', prefs.sea ? 'visible' : 'none');
  }
  document.querySelectorAll('[data-base]').forEach(b => b.setAttribute('aria-checked', b.dataset.base === prefs.base));
  $('#m-sea').setAttribute('aria-checked', prefs.sea);
  $('#m-names').setAttribute('aria-checked', prefs.names);
  ls.set('prefs.v5', prefs);
}
map.on('click', e => {
  $('#menu').classList.remove('on');
  const p = e.point, box = [[p.x - 14, p.y - 14], [p.x + 14, p.y + 14]];
  const layers = ['fleet', 'ships'].filter(l => map.getLayer(l));
  const hit = map.queryRenderedFeatures(box, {layers});
  if (!hit.length) return;
  hit.sort((a, b) => b.properties.mine - a.properties.mine);
  openShip(SHIPS[hit[0].properties.i], false);
});
map.on('mousemove', e => { const l = ['fleet', 'ships'].filter(x => map.getLayer(x));
  map.getCanvas().style.cursor = l.length && map.queryRenderedFeatures(e.point, {layers: l}).length ? 'pointer' : ''; });

/* ---------- where am I ---------- */
let meMarker = null;
function locate(then){
  if (!navigator.geolocation){ toast('Этот браузер не умеет определять место'); return; }
  toast('Определяю, где ты…');
  navigator.geolocation.getCurrentPosition(p => {
    myPos = {lat: p.coords.latitude, lng: p.coords.longitude};
    if (!meMarker){ const el = document.createElement('div'); el.className = 'me'; meMarker = new maplibregl.Marker({element: el}).setLngLat([myPos.lng, myPos.lat]).addTo(map); }
    else meMarker.setLngLat([myPos.lng, myPos.lat]);
    if (then) then();
    flyVisible(myPos, Math.max(map.getZoom(), 10));
  }, err => toast(err.code === 1 ? 'Нет доступа к геопозиции: разреши его в настройках браузера' : 'Не получилось определить место, попробуй ещё раз'),
  {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}

/* ---------- sheet & tabs ---------- */
const sheet = $('#sheet');
function openSheet(title){ $('#stitle').textContent = title; sheet.classList.add('on'); }
const TITLES = {map:'Карта', fleet:'Мой флот', search:'Поиск', near:'Рядом'};
function setTab(t){
  tab = t; shipOpen = null; $('#htitle').textContent = TITLES[t];
  if (t === 'map' && desktop()) t = 'fleet';
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === (desktop() ? t : tab)));
  if (t === 'map'){ sheet.classList.remove('on', 'full'); draw(); return; }
  // like Ship Info: fleet and search are whole pages, «Рядом» and ship cards leave the map visible
  sheet.classList.toggle('full', t === 'fleet' || t === 'search');
  if (t === 'fleet') renderFleet();
  if (t === 'search') renderSearch();
  if (t === 'near'){ renderNear(); if (!myPos) locate(renderNear); }
  draw();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('#sclose').onclick = () => setTab('map');
$('#sbox').onclick = () => setTab('search');
{ let y0 = null, moved = false; const g = $('#grab');
  g.addEventListener('pointerdown', e => { y0 = e.clientY; moved = false; g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove', e => { if (y0 != null && Math.abs(e.clientY - y0) > 8) moved = true; });
  g.addEventListener('pointerup', e => { if (y0 == null) return; const dy = e.clientY - y0; y0 = null;
    if (!moved) return sheet.classList.toggle('full');
    if (dy > 40) sheet.classList.contains('full') ? sheet.classList.remove('full') : setTab('map');
    else if (dy < -40) sheet.classList.add('full'); }); }

/* ---------- lists ---------- */
function stateLine(r){
  const ts = get(r,'tpos'), sog = get(r,'sog');
  if (!ts) return {cls:'', txt:'позиции пока нет'};
  if (Date.now()/1000 - ts > 2*86400) return {cls:'old', txt:'вне зоны береговых станций'};
  if ((sog||0) >= .5) return {cls:'go', txt:`${sog.toFixed(1)} уз${get(r,'dest') ? ', на ' + get(r,'dest') : ''}`};
  return {cls:'stop', txt: NAV[get(r,'nav')] || 'стоит'};
}
function rowHtml(r, i, extra){
  const s = stateLine(r);
  return `<li class="row${fleetSet.has(r) ? ' mine' : ''}" data-i="${i}" tabindex="0">
    <span class="flag" aria-hidden="true">${flagOf(get(r,'mmsi'))}</span>
    <span class="nm">${esc(get(r,'name') || 'MMSI ' + get(r,'mmsi'))}</span>
    <span class="right">${esc(extra && extra.right ? extra.right : ago(get(r,'tpos')))}</span>
    <span class="meta"><span class="dot ${s.cls}"></span>${esc(s.txt)}</span>
    <span class="meta">${esc(typeName(get(r,'type')))}${get(r,'imo') ? ', IMO ' + esc(get(r,'imo')) : ''}${get(r,'len') ? ', ' + esc(get(r,'len')) + ' м' : ''}</span>
    ${extra && extra.note ? `<span class="note">${esc(extra.note)}</span>` : ''}</li>`;
}
function bindRows(el, rows){
  el.querySelectorAll('.row[data-i]').forEach(li => { const go = () => openShip(rows[+li.dataset.i], true); li.onclick = go; li.onkeydown = e => { if (e.key === 'Enter') go(); }; });
}
const statusLine = () => SHIPS.length ? `<p class="status">В базе ${SHIPS.length.toLocaleString('ru')} судов. Обновлено ${esc(ago(updated))}, обновляется каждые 30 минут.</p>` : '';

function renderFleet(){
  openSheet('Мой флот');
  const body = $('#sbody');
  if (!fleet.length){
    body.innerHTML = `<div class="empty"><strong>Здесь будут суда, на которых ты работал</strong>
      Найди судно по названию, IMO или MMSI и нажми «Добавить в мои суда». На карте оно будет малиновым и с названием.</div>
      <div class="btns"><button class="btn main" id="go-s">Найти судно</button></div>${transferHtml()}${statusLine()}`;
    $('#go-s').onclick = () => setTab('search'); bindTransfer(); return;
  }
  const rows = [], pending = [];
  fleet.forEach(e => { const r = findShip(e); if (r) rows.push([r, e]); else pending.push(e); });
  rows.sort((a, b) => (get(b[0],'tpos')||0) - (get(a[0],'tpos')||0));
  body.innerHTML = `<ul class="list" id="fl">${rows.map(([r, e], i) => rowHtml(r, i, {note:e.note})).join('')}</ul>
    ${pending.length ? `<p class="hint" style="margin-top:16px">Ждут первого сигнала AIS:</p><ul class="list">${pending.map((e, i) =>
      `<li class="row" style="cursor:default"><span class="flag">⏳</span><span class="nm">${esc(e.name || (e.imo ? 'IMO ' + e.imo : 'MMSI ' + e.mmsi))}</span>
       <button class="btn" style="min-height:36px" data-rm="${i}">Убрать</button><span class="meta">Появится, когда судно даст сигнал у берега</span>${e.note ? `<span class="note">${esc(e.note)}</span>` : ''}</li>`).join('')}</ul>` : ''}
    <div class="btns"><button class="btn" id="fit">Показать все на карте</button><button class="btn" id="add">Добавить судно</button></div>${transferHtml()}${statusLine()}`;
  bindRows($('#fl'), rows.map(x => x[0]));
  body.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const e = pending[+b.dataset.rm]; fleet = fleet.filter(x => x !== e); saveFleet(); renderFleet(); });
  $('#fit').onclick = fitFleet; $('#add').onclick = () => setTab('search');
  bindTransfer();
}
function transferHtml(){
  return `<details><summary>Перенести список на другое устройство</summary>
    <p class="hint">Список хранится в этом браузере. Скопируй код и вставь его на другом телефоне или компьютере.</p>
    <div class="btns"><button class="btn" id="cp">Скопировать код</button></div>
    <label class="f" for="imp">Код с другого устройства</label><textarea id="imp" placeholder="Вставь код сюда"></textarea>
    <div class="btns"><button class="btn" id="imp-b">Загрузить список</button></div></details>`;
}
function bindTransfer(){
  $('#cp').onclick = async () => {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(fleet))));
    try { await navigator.clipboard.writeText(code); toast('Код скопирован'); } catch(e){ $('#imp').value = code; $('#imp').select(); toast('Скопируй код из поля ниже'); }
  };
  $('#imp-b').onclick = () => {
    try {
      const list = JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim())))); if (!Array.isArray(list)) throw 0;
      let added = 0;
      for (const e of list) if ((e.imo || e.mmsi) && !fleet.some(x => (e.imo && x.imo == e.imo) || (e.mmsi && x.mmsi == e.mmsi))){ fleet.push(e); added++; }
      saveFleet(); renderFleet(); toast(`Добавлено судов: ${added}`);
    } catch(e){ toast('Код не распознан. Скопируй его целиком'); }
  };
}

function search(q){
  q = q.trim().toUpperCase(); if (!q) return [];
  if (/^\d{7}$/.test(q)){ const r = byImo.get(+q); return r ? [r] : []; }
  if (/^\d{9}$/.test(q)){ const r = byMmsi.get(+q); return r ? [r] : []; }
  const out = [];
  for (const r of SHIPS){
    const n = get(r,'name') || '', p = get(r,'prev') || '';
    const sc = n === q ? 0 : n.startsWith(q) ? 1 : n.includes(q) ? 2 : p.includes(q) ? 3 : (String(get(r,'imo')||'').startsWith(q) || String(get(r,'mmsi')).startsWith(q)) ? 4 : -1;
    if (sc >= 0) out.push([sc + (get(r,'imo') ? 0 : .5), r]);
  }
  return out.sort((a, b) => a[0] - b[0] || (get(b[1],'tpos')||0) - (get(a[1],'tpos')||0)).slice(0, 80).map(x => x[1]);
}
function renderSearch(){
  openSheet('Поиск судна');
  $('#sbody').innerHTML = `<div class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg>
    <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="characters" placeholder="Название, IMO или MMSI" value="${esc(query)}"></div><div id="res"></div>`;
  const q = $('#q'); q.oninput = () => { query = q.value; renderResults(); };
  setTimeout(() => q.focus(), 300);
  renderResults();
}
function renderResults(){
  const box = $('#res'), q = query.trim();
  if (!q){ box.innerHTML = `<p class="hint">Ищи по названию судна, IMO (7 цифр) или MMSI (9 цифр). Переименованное судно находится и по старому названию.</p>${statusLine()}`; return; }
  const rows = search(q);
  if (!rows.length){
    const num = /^\d{7}$|^\d{9}$/.test(q);
    box.innerHTML = `<div class="empty"><strong>В базе пока нет «${esc(q)}»</strong>
      База пополняется каждые полчаса, когда суда проходят рядом с береговыми станциями AIS.${num ? ' Можно уже сейчас добавить судно в свои: оно появится, когда даст сигнал.' : ' Можно поискать в официальной базе Equasis.'}</div>
      <div class="btns">${num ? `<button class="btn main" id="addnum">Добавить ${q.length === 7 ? 'IMO' : 'MMSI'} ${esc(q)} в мои суда</button>` : ''}
      <a class="btn" href="https://www.equasis.org/" target="_blank" rel="noopener">Открыть Equasis</a></div>`;
    if (num) $('#addnum').onclick = () => { fleet.push(q.length === 7 ? {imo:+q, added:Date.now()} : {mmsi:+q, added:Date.now()}); saveFleet(); toast('Добавлено в мои суда'); setTab('fleet'); };
    return;
  }
  box.innerHTML = `<p class="hint">Найдено: ${rows.length}${rows.length === 80 ? '+' : ''}</p><ul class="list" id="rl">${rows.map((r, i) => rowHtml(r, i)).join('')}</ul>`;
  bindRows($('#rl'), rows);
}

function renderNear(){
  openSheet('Суда рядом');
  const body = $('#sbody');
  if (!myPos){ body.innerHTML = `<div class="empty"><strong>Определяю, где ты</strong>Если браузер спросит про геопозицию, нажми «Разрешить».</div><div class="btns"><button class="btn main" id="loc2">Определить место</button></div>`; $('#loc2').onclick = () => locate(renderNear); return; }
  const list = [];
  for (const r of SHIPS){ const lat = get(r,'lat'); if (lat == null || Math.abs(lat - myPos.lat) > 1.5) continue;
    const d = nm(myPos, [lat, get(r,'lon')]); if (d <= 50) list.push([d, r]); }
  list.sort((a, b) => a[0] - b[0]);
  const rows = list.slice(0, 150);
  body.innerHTML = rows.length ? `<p class="hint">В радиусе 50 миль: ${list.length}. Ближайшие сверху.</p><ul class="list" id="nl">${rows.map(([d, r], i) => rowHtml(r, i, {right: fmtNm(d)})).join('')}</ul>`
    : `<div class="empty"><strong>В 50 милях от тебя судов в базе нет</strong>База пока молодая: суда появятся после следующих обновлений.</div>`;
  if (rows.length) bindRows($('#nl'), rows.map(x => x[1]));
}

function openShip(r, fly){
  shipOpen = r; renderShip();
  if (get(r,'lat') != null){
    const ll = [get(r,'lat'), get(r,'lon')];
    flyVisible(ll, fly ? Math.max(map.getZoom(), 10) : map.getZoom());
  }
  draw();
}
function renderShip(){
  const r = shipOpen, idx = fleetIdx(r), e = fleet[idx], imo = get(r,'imo'), mmsi = get(r,'mmsi');
  const c = iso(mmsi), s = stateLine(r), sog = get(r,'sog'), dir = get(r,'hdg') ?? get(r,'cog'), nav = NAV[get(r,'nav')];
  const dist = myPos && get(r,'lat') != null ? fmtNm(nm(myPos, [get(r,'lat'), get(r,'lon')])) : '';
  const imoText = imo || (get(r,'tstatic') ? 'нет (судно без номера IMO)' : 'ещё не получен по AIS');
  const facts = [['IMO', imoText], ['MMSI', mmsi], ['Позывной', get(r,'call')], ['Флаг', c ? regionName(c) : ''],
    ['Тип по AIS', typeName(get(r,'type'))], ['Размеры', get(r,'len') ? `${get(r,'len')} × ${get(r,'beam') || '?'} м` : ''],
    ['Осадка', get(r,'draught') ? get(r,'draught') + ' м' : ''], ['Назначение', get(r,'dest')], ['ETA по AIS', get(r,'eta')],
    ['От меня', dist], ['Прежние имена', (get(r,'prev') || '').split('|').filter(Boolean).join(', ')],
    ['Координаты', get(r,'lat') != null ? `${get(r,'lat').toFixed(4)}, ${get(r,'lon').toFixed(4)}` : '']].filter(x => x[1] !== '' && x[1] != null);
  openSheet(get(r,'name') || 'MMSI ' + mmsi);
  $('#sbody').innerHTML = `
    <div class="photo" id="photo"></div><p class="cap" id="pcap"></p>
    <p class="sub">${flagOf(mmsi)} ${esc(c ? regionName(c) : 'флаг неизвестен')}, ${esc(typeName(get(r,'type')))}</p>
    <div class="now">
      <div><b>${sog != null ? esc(sog.toFixed(1)) : '–'}</b><span>узлов</span></div>
      <div><b>${dir != null ? esc(Math.round(dir)) + '°' : '–'}</b><span>курс</span></div>
      <div><b>${esc(nav || '–')}</b><span>статус</span></div>
      <p><span class="dot ${s.cls}"></span>Позиция ${esc(ago(get(r,'tpos')))}${get(r,'tpos') ? ' (' + esc(fmtDate(get(r,'tpos'))) + ')' : ''}</p>
    </div>
    <div class="btns">${idx >= 0 ? `<button class="btn" id="rm">Убрать из моих судов</button>` : `<button class="btn main" id="ad">Добавить в мои суда</button>`}
      ${get(r,'lat') != null ? `<button class="btn" id="sh">На карте</button>` : ''}</div>
    ${idx >= 0 ? `<label class="f" for="nt">Мои заметки: годы, должность, рейсы</label><textarea id="nt" placeholder="Например: 2021–2022, AB, контракт 6 мес.">${esc(e.note || '')}</textarea>` : ''}
    <dl>${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <p class="hint">AIS не различает балкер и контейнеровоз. Полные характеристики, владелец и инспекции есть в Equasis.</p>
    <div class="links">
      ${imo ? `<a class="btn" target="_blank" rel="noopener" href="https://www.equasis.org/EquasisWeb/restricted/ShipInfo?fs=Search&P_IMO=${encodeURIComponent(imo)}">Equasis</a>
      <a class="btn" target="_blank" rel="noopener" href="https://www.shipspotting.com/photos/gallery?imo=${encodeURIComponent(imo)}">Фото судна</a>
      <a class="btn" target="_blank" rel="noopener" href="https://www.vesselfinder.com/vessels/details/${encodeURIComponent(imo)}">VesselFinder</a>` : ''}
      <a class="btn" target="_blank" rel="noopener" href="https://www.marinetraffic.com/en/ais/details/ships/mmsi:${encodeURIComponent(mmsi)}">MarineTraffic</a>
    </div>`;
  showPhoto(r);
  if ($('#sh')) $('#sh').onclick = () => { if (!desktop()) sheet.classList.remove('full'); flyVisible([get(r,'lat'), get(r,'lon')], 12); };
  if ($('#ad')) $('#ad').onclick = () => { fleet.push({imo: imo || null, mmsi, name: get(r,'name'), note:'', added:Date.now()}); saveFleet(); toast('Добавлено в мои суда'); renderShip(); };
  if ($('#rm')) $('#rm').onclick = () => { fleet.splice(idx, 1); saveFleet(); toast('Убрано из моих судов'); renderShip(); };
  if ($('#nt')) $('#nt').onchange = ev => { e.note = ev.target.value.trim(); saveFleet(); toast('Заметка сохранена'); };
}

/* Ship photo from Wikimedia Commons: an open source with free licences, searched by IMO */
const photoCache = new Map();
const plain = html => { const d = document.createElement('div'); d.innerHTML = html || ''; return (d.textContent || '').trim(); };
async function commons(params){
  const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=900&' + params;
  const res = await fetch(u); const j = await res.json();
  const pages = Object.values((j.query && j.query.pages) || {}).filter(p => p.imageinfo && /\.(jpe?g|png|webp)$/i.test(p.title));
  pages.sort((a, b) => (a.index || 0) - (b.index || 0));
  return pages[0] || null;
}
async function viaWikidata(imo){
  // ships in Wikidata carry their IMO number (P458) and often a photo (P18)
  const q = await (await fetch('https://www.wikidata.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=1&srsearch=' + encodeURIComponent('haswbstatement:P458=' + imo))).json();
  const id = q.query && q.query.search[0] && q.query.search[0].title; if (!id) return null;
  const e = await (await fetch('https://www.wikidata.org/w/api.php?action=wbgetclaims&format=json&origin=*&property=P18&entity=' + id)).json();
  const f = e.claims && e.claims.P18 && e.claims.P18[0] && e.claims.P18[0].mainsnak.datavalue && e.claims.P18[0].mainsnak.datavalue.value;
  return f ? await commons('titles=' + encodeURIComponent('File:' + f)) : null;
}
// Openverse: search engine of Creative-Commons photos (Flickr, Commons and others), free, no key
async function openverse(q, imo, name){
  const j = await (await fetch('https://api.openverse.org/v1/images/?page_size=20&mature=false&q=' + encodeURIComponent(q))).json();
  const norm = t => String(t || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
  const hit = (j.results || []).find(x => { const t = norm(x.title) + ' ' + norm((x.tags || []).map(g => g.name).join(' '));
    return t.includes(String(imo)) || (name && name.length >= 4 && norm(x.title).includes(norm(name))); });
  if (!hit) return null;
  return {imageinfo: [{thumburl: hit.thumbnail || hit.url, url: hit.url, descriptionurl: hit.foreign_landing_url,
    extmetadata: {Artist: {value: hit.creator || ''}, LicenseShortName: {value: ('CC ' + (hit.license || '').toUpperCase() + ' ' + (hit.license_version || '')).trim()}}}],
    source: hit.source};
}
async function findPhoto(imo, name){
  if (photoCache.has(imo)) return photoCache.get(imo);
  const stored = ls.get('pc.' + imo, null);   // remember answers between visits (a miss for a week)
  if (stored && (stored.p || Date.now() - stored.t < 7 * 864e5)){ photoCache.set(imo, stored.p); return stored.p; }
  let p = null;
  const tries = [
    () => viaWikidata(imo),
    () => commons('generator=categorymembers&gcmtype=file&gcmlimit=10&gcmtitle=' + encodeURIComponent('Category:IMO ' + imo)),
    () => commons('generator=search&gsrnamespace=6&gsrlimit=5&gsrsearch=' + encodeURIComponent('"IMO ' + imo + '"')),
    () => openverse('IMO ' + imo, imo, null),
    // last resort: files whose title holds the ship's name, e.g. "Ever Ally (ship, 2023).jpg"
    async () => { if (!name || name.length < 4) return null;
      const hit = await commons('generator=search&gsrnamespace=6&gsrlimit=10&gsrsearch=' + encodeURIComponent('intitle:"' + name + '" ship'));
      const norm = t => t.toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
      return hit && norm(hit.title).includes(norm(name)) ? hit : null; },
    () => name && name.length >= 4 ? openverse('"' + name + '" ship', imo, name) : null,
  ];
  for (const t of tries){ try { p = await t(); } catch(e){ p = null; } if (p) break; }
  const ii = p && p.imageinfo[0], md = (ii && ii.extmetadata) || {};
  const out = ii ? {src: ii.thumburl || ii.url, page: ii.descriptionurl,
    author: plain(md.Artist && md.Artist.value).slice(0, 80), lic: plain(md.LicenseShortName && md.LicenseShortName.value),
    where: p.source ? 'Openverse (' + p.source + ')' : 'Wikimedia Commons'} : null;
  photoCache.set(imo, out); ls.set('pc.' + imo, {p: out, t: Date.now()}); return out;
}
/* the user's own photos, kept in this browser (resized to keep storage small) */
const myPhotoKey = r => 'photo.' + (get(r,'imo') || 'm' + get(r,'mmsi'));
function pickOwnPhoto(r){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      if (ls.set(myPhotoKey(r), c.toDataURL('image/jpeg', .8))){ toast('Фото сохранено'); if (shipOpen === r) showPhoto(r); }
      else toast('Не хватило места в браузере: удали другие свои фото');
    };
    img.onerror = () => toast('Не получилось открыть этот файл как фото');
    img.src = url;
  };
  inp.click();
}
function photoLinks(r){
  const imo = get(r,'imo'), mmsi = get(r,'mmsi');
  return `<span class="btns" style="justify-content:center;margin:10px 0 0">
    ${imo ? `<a class="btn" target="_blank" rel="noopener" href="https://www.vesselfinder.com/vessels/details/${encodeURIComponent(imo)}">Фото на VesselFinder</a>
    <a class="btn" target="_blank" rel="noopener" href="https://www.shipspotting.com/photos/gallery?imo=${encodeURIComponent(imo)}">ShipSpotting</a>` : ''}
    <a class="btn" target="_blank" rel="noopener" href="https://www.marinetraffic.com/en/ais/details/ships/${imo ? 'imo:' + encodeURIComponent(imo) : 'mmsi:' + encodeURIComponent(mmsi)}">MarineTraffic</a></span>`;
}
async function showPhoto(r){
  const box = $('#photo'), cap = $('#pcap'); if (!box) return;
  const own = ls.get(myPhotoKey(r), null);
  box.style.aspectRatio = ''; box.style.padding = ''; cap.textContent = '';
  if (own){
    const img = new Image(); img.alt = 'Моё фото судна'; img.src = own; box.textContent = ''; box.appendChild(img);
    cap.innerHTML = `Моё фото. <a href="#" id="ph-rep">Заменить</a> или <a href="#" id="ph-del">удалить</a>`;
    $('#ph-rep').onclick = e => { e.preventDefault(); pickOwnPhoto(r); };
    $('#ph-del').onclick = e => { e.preventDefault(); try { localStorage.removeItem(myPhotoKey(r)); } catch(x){} showPhoto(r); };
    return;
  }
  const imo = get(r,'imo');
  box.textContent = imo ? 'Ищу фото…' : '';
  const ph = imo ? await findPhoto(imo, get(r,'name')) : null;
  if (shipOpen !== r) return;   // the user already opened another ship
  if (!ph){
    box.style.aspectRatio = 'auto'; box.style.padding = '14px';
    box.innerHTML = `<div>${imo ? 'Свободного фото этого судна в открытых архивах пока нет' : 'У судна нет номера IMO'}<br>${photoLinks(r)}</div>`;
    return;
  }
  const img = new Image(); img.alt = 'Фото судна ' + (get(r,'name') || '');
  img.onload = () => { box.textContent = ''; box.appendChild(img); };
  img.onerror = () => { box.textContent = 'Фото не загрузилось'; };
  img.src = ph.src;
  if (/^https:\/\//.test(ph.page)) cap.innerHTML = `Фото: ${esc(ph.author || 'автор не указан')}${ph.lic ? ', ' + esc(ph.lic) : ''}, <a href="${esc(ph.page)}" target="_blank" rel="noopener">${esc(ph.where || 'Wikimedia Commons')}</a>`;
  const o = $('#ph-own'); if (o) o.onclick = e => { e.preventDefault(); pickOwnPhoto(r); };
}

function saveFleet(){ if (!ls.set('fleet.v1', fleet)) toast('Браузер не сохраняет данные: список пропадёт после закрытия'); refreshFleetSet(); draw(); }
function fitFleet(){
  const pts = [...fleetSet].filter(r => get(r,'lat') != null).map(r => [get(r,'lat'), get(r,'lon')]);
  if (!pts.length){ toast(fleet.length ? 'У моих судов пока нет позиций' : 'Добавь свои суда через поиск'); return; }
  if (!desktop()) setTab('map');
  if (pts.length === 1) map.flyTo({center: [pts[0][1], pts[0][0]], zoom: 9});
  else map.fitBounds(pts.reduce((b, p) => b.extend([p[1], p[0]]), new maplibregl.LngLatBounds([pts[0][1], pts[0][0]], [pts[0][1], pts[0][0]])), {padding: 60, maxZoom: 9});
}

/* ---------- controls ---------- */
$('#f-loc').onclick = () => locate(() => { if (tab === 'near' || desktop()) setTab('near'); });
$('#f-fleet').onclick = fitFleet;
$('#f-list').onclick = () => setTab('near');
$('#hmenu').onclick = () => $('#f-layers').click();
$('#f-layers').onclick = e => { const m = $('#menu'), on = !m.classList.contains('on'); m.classList.toggle('on', on); e.currentTarget.setAttribute('aria-expanded', on); };
document.querySelectorAll('[data-base]').forEach(b => b.onclick = () => { prefs.base = b.dataset.base; applyPrefs(); });
$('#m-sea').onclick = () => { prefs.sea = !prefs.sea; applyPrefs(); };
$('#m-names').onclick = () => { prefs.names = !prefs.names; applyPrefs(); };
map.on('movestart', () => $('#menu').classList.remove('on'));

/* ---------- data ---------- */
$('#legend').innerHTML = GROUPS.map(g => `<span><i style="background:${g[1]}"></i>${esc(g[0])}</span>`).join('') + `<span><i style="background:#ec4f9e"></i>Мои суда</span>`;
applyPrefs(); refreshFleetSet();
if (desktop()) setTab('fleet');
fetch('data/ships.json', {cache:'no-cache'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
  d.fields.forEach((f, i) => F[f] = i);
  SHIPS = d.ships; updated = d.updated;
  for (const r of SHIPS){ byMmsi.set(get(r,'mmsi'), r); if (get(r,'imo')) byImo.set(get(r,'imo'), r); }
  fleet.forEach(e => { const r = findShip(e); if (r){ e.name = get(r,'name'); if (!e.mmsi) e.mmsi = get(r,'mmsi'); } });
  ls.set('fleet.v1', fleet); refreshFleetSet();
  const pts = [...fleetSet].filter(r => get(r,'lat') != null).map(r => [get(r,'lat'), get(r,'lon')]);
  if (pts.length) map.fitBounds(pts.reduce((b, p) => b.extend([p[1], p[0]]), new maplibregl.LngLatBounds([pts[0][1], pts[0][0]], [pts[0][1], pts[0][0]])), {padding: 60, maxZoom: 7, duration: 0});
  if (sheet.classList.contains('on')) setTab(tab === 'map' ? 'fleet' : tab);
  draw();
}).catch(() => { $('#count').dataset.msg = 'База ещё не собрана: подожди первого обновления'; draw(); });
}
